<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>צייר המוחות – הדמיית 8 טלפונים</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBF6EC;--paper2:#F2E9D8;--sheet:#FFFDF8;--ink:#1F2440;--ink2:#565A78;--ink3:#8A8DA6;--line:#E3D7C0;--accent:#E2461F;
 --l1:#1A8E58;--l1bg:#DCF2E5;--l2:#B87400;--l2bg:#FBEBC8;--l3:#6343D6;--l3bg:#E8E2FB;--ok:#1A8E58;--bad:#CF3338;font-family:"Fredoka",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#2A2F4F;color:var(--ink);overflow:hidden}
button{font:inherit;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
#wrap{display:grid;grid-template-columns:1fr 330px;grid-template-rows:56px 1fr;height:100%}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 18px;background:#1F2440;color:#fff}
header h1{font-size:20px;font-weight:700;flex:1}
header h1 span{font-weight:400;opacity:.7;font-size:15px;margin-right:8px}
.hb{height:38px;padding:0 16px;border-radius:12px;background:#3A4068;color:#fff;font-weight:600;font-size:15px}
.hb.red{background:var(--accent)}
#phones{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:max-content;gap:18px 14px;padding:14px;min-height:0;overflow-y:auto;align-content:start;scrollbar-color:#4A5080 transparent}
.ph{position:relative;display:flex;flex-direction:column;align-items:center;min-height:0}
.ph .lab{position:absolute;top:0;right:4px;color:#C9CCE4;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center;z-index:2}
.ph .lab button{background:#3A4068;color:#fff;border-radius:8px;height:22px;padding:0 8px;font-size:12px}
.hold{position:relative;flex:none;margin-top:14px}
.frame{position:absolute;top:0;left:0;width:390px;height:800px;border-radius:44px;background:#0E1124;padding:10px;box-shadow:0 18px 40px -18px #000;transform-origin:0 0}
.frame iframe{width:370px;height:780px;border:0;border-radius:34px;background:var(--paper);display:block}
aside{background:var(--paper);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;border-right:1px solid #11152c}
aside h2{font-size:17px;font-weight:700;margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.st{background:var(--sheet);border:1.5px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.st b{display:block;font-size:22px}
.st span{font-size:12.5px;color:var(--ink2)}
.lv1{--lc:var(--l1);--lb:var(--l1bg)}.lv2{--lc:var(--l2);--lb:var(--l2bg)}.lv3{--lc:var(--l3);--lb:var(--l3bg)}
.lvRow{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0}
.lvRow .nm{width:62px;font-weight:600;color:var(--lc)}
.lvRow .tr{flex:1;height:12px;border-radius:6px;background:var(--paper2);overflow:hidden}
.lvRow .fl{height:100%;background:var(--lc)}
.lvRow .v{width:96px;text-align:left;color:var(--ink2);font-size:12.5px}
.box{background:var(--sheet);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.lr{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--paper2);font-size:14.5px}
.lr:last-child{border-bottom:0}
.lr i{font-style:normal;width:20px;color:var(--ink3);font-weight:600}
.lr span{flex:1}
.lr small{color:var(--ink3)}
.fr{padding:8px 12px;border-bottom:1px solid var(--paper2);font-size:13.5px;line-height:1.4}
.fr:last-child{border-bottom:0}
.fr b.w{color:var(--lc)}
.fr .p{float:left;font-weight:700}
.fr.ok .p{color:var(--ok)}.fr.no .p{color:var(--bad)}
.empty{padding:14px;color:var(--ink2);font-size:14px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
 <header>
  <h1>צייר המוחות<span>הדמיה · 8 טלפונים · סביבת בדיקה נפרדת</span></h1>
  <label class="hb" style="display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="fit">כל 8 במסך אחד</label>
  <button class="hb" id="reload">רענון כל הטלפונים</button>
  <button class="hb red" id="reset">איפוס סביבת הבדיקה</button>
 </header>
 <section id="phones"></section>
 <aside>
  <div><h2>מצב המשחק</h2>
   <div class="stats"><div class="st"><b class="num" id="sOpen">0</b><span>אתגרים פתוחים</span></div><div class="st"><b class="num" id="sTries">0</b><span>ניסיונות</span></div><div class="st"><b class="num" id="sRate">–</b><span>הצלחה</span></div></div>
  </div>
  <div><h2>הצלחה לפי רמה</h2><div id="lv"></div></div>
  <div><h2>דירוג</h2><div class="box" id="lb"></div></div>
  <div><h2>מה קרה עכשיו</h2><div class="box" id="feed"></div></div>
 </aside>
</div>
<script>
const $=s=>document.querySelector(s);
const LV={1:'פשוטות',2:'בינוניות',3:'מורכבות'};
const ph=$('#phones');
for(let i=1;i<=8;i++){
 const d=document.createElement('div');d.className='ph';
 d.innerHTML=`<div class="lab">טלפון ${i}<button>רענון</button></div><div class="hold"><div class="frame"><iframe src="/?ns=test&slot=${i}&sim=1" title="טלפון ${i}"></iframe></div></div>`;
 d.querySelector('button').onclick=()=>{const f=d.querySelector('iframe');f.src=f.src;};
 ph.appendChild(d);
}
function fit(){const c=ph.querySelector('.ph');if(!c)return;const r=c.getBoundingClientRect();const vh=ph.clientHeight-28,fitAll=$('#fit').checked;const s=Math.min(1,(r.width-6)/390,fitAll?(vh/2-26)/800:9);document.querySelectorAll('.hold').forEach(h=>{h.style.width=390*s+'px';h.style.height=800*s+'px';h.firstChild.style.transform=`scale(${s})`;});}
addEventListener('resize',fit);$('#fit').onchange=fit;setTimeout(fit,50);
$('#reload').onclick=()=>document.querySelectorAll('iframe').forEach(f=>f.src=f.src);
let resetArm=0;
$('#reset').onclick=async()=>{
 const btn=$('#reset');
 if(Date.now()-resetArm>4000){resetArm=Date.now();btn.textContent='לחצו שוב למחיקת הכל';setTimeout(()=>{btn.textContent='איפוס סביבת הבדיקה';},4000);return;}
 resetArm=0;btn.textContent='איפוס סביבת הבדיקה';
 await fetch('/api/reset?ns=test',{method:'POST'});
 Object.keys(localStorage).filter(k=>k.startsWith('tz_test_')).forEach(k=>localStorage.removeItem(k));
 document.querySelectorAll('iframe').forEach(f=>f.src=f.src);poll();
};
function esc(t){const s=document.createElement('span');s.textContent=t==null?'':t;return s.innerHTML;}
async function poll(){
 try{
  const [f,l]=await Promise.all([fetch('/api/feed?ns=test').then(r=>r.json()),fetch('/api/leaders?ns=test').then(r=>r.json())]);
  const tot=f.stats.reduce((a,s)=>a+s.n,0),ok=f.stats.reduce((a,s)=>a+(s.ok||0),0);
  $('#sOpen').textContent=f.open;$('#sTries').textContent=tot;$('#sRate').textContent=tot?Math.round(ok/tot*100)+'%':'–';
  $('#lv').innerHTML=[1,2,3].map(k=>{const s=f.stats.find(x=>x.lvl===k)||{n:0,ok:0};const r=s.n?s.ok/s.n:0;
   return `<div class="lvRow lv${k}"><span class="nm">${LV[k]}</span><span class="tr"><span class="fl" style="display:block;width:${r*100}%"></span></span><span class="v num">${s.n?`${s.ok}/${s.n} · ביטחון ${s.conf?Math.round(s.conf*100):0}%`:'אין עדיין'}</span></div>`;}).join('');
  $('#lb').innerHTML=l.leaders.length?l.leaders.map((p,i)=>`<div class="lr"><i class="num">${i+1}</i><span>${esc(p.name)} <small>· ${p.words} מילים</small></span><b class="num">${p.score}</b></div>`).join(''):'<div class="empty">צרו שחקנים בטלפונים</div>';
  $('#feed').innerHTML=f.feed.length?f.feed.map(a=>`<div class="fr lv${a.lvl} ${a.ok?'ok':'no'}"><span class="p num"><bdi dir="ltr">${a.points>0?"+":""}${a.points}</bdi></span>${esc(a.drawer)} צייר <b class="w">${esc(a.word)}</b> למוח של ${esc(a.owner)} (${a.k} מילים) – ${a.ok?`זוהה ב־${Math.round(a.conf*100)}%`:`נחשב ל"${esc(a.guess||'כלום')}"`}</div>`).join(''):'<div class="empty">עוד אין ניסיונות</div>';
 }catch(e){}
}
poll();setInterval(poll,3000);
</script>
</body>
</html>
